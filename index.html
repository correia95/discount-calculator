    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Discount Calculator",
        "url": "https://discount-calculator.correia95.workers.dev/",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Calculate the sale price after percentage and fixed-amount discounts, stacked or summed, with optional sales tax, and see the saving, entirely in the browser."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I calculate a percentage discount?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Multiply the price by the discount percentage and subtract. 25 percent off 80 is 80 minus 20, which is 60. Enter the price and the discount and the calculator shows the sale price and the saving."
            }
          },
          {
            "@type": "Question",
            "name": "Is 20% off then 10% off the same as 30% off?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The second discount comes off the already-reduced price. On 100 you would pay 100, then 80, then 72 - that is 28 percent off, not 30. Use the 'apply one after another' option to compound discounts."
            }
          },
          {
            "@type": "Question",
            "name": "Is tax applied before or after the discount?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "After. Sales tax and VAT are charged on the price you actually pay, so the calculator applies the tax rate to the discounted price."
            }
          },
          {
            "@type": "Question",
            "name": "Can I combine a percentage discount and a money-off voucher?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Add both. A fixed-amount discount subtracts a flat sum and cannot take the price below zero. Check your retailer's terms for the order, as it can change the total."
            }
          }
        ]
      }
    </script>
